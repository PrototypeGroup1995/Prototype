<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTOTYPE — Linki</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  background:#080808;
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}
body:before{
  content:"";
  position:fixed; inset:-20%;
  background:
    radial-gradient(circle at 50% 110%,rgba(255,90,0,.28),transparent 32%),
    radial-gradient(circle at 20% 20%,rgba(255,170,0,.08),transparent 25%);
  animation:pulse 4s ease-in-out infinite alternate;
}
.flame{
  position:fixed; bottom:-80px; left:50%;
  width:500px;height:220px;
  transform:translateX(-50%);
  background:radial-gradient(ellipse,rgba(255,90,0,.2),transparent 65%);
  filter:blur(18px);
  animation:fire 2s ease-in-out infinite alternate;
}
.card{
  position:relative;
  width:min(440px,92vw);
  padding:34px 22px;
  text-align:center;
  background:rgba(12,12,12,.86);
  border:1px solid rgba(255,120,20,.35);
  border-radius:24px;
  box-shadow:0 0 45px rgba(255,70,0,.14);
  backdrop-filter:blur(12px);
}
.logo{
  width:92px;height:92px;margin:0 auto 16px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:27px;font-weight:900;
  border:2px solid #ff7a00;
  box-shadow:0 0 25px rgba(255,100,0,.45);
}
.logo-img {
  width: 110px;
  height: 110px;
  object-fit: cover;
  border-radius: 50%;
  border: 2px solid #ff7a00;
  box-shadow: 0 0 25px rgba(255,100,0,.45);
}
h1{font-size:28px;letter-spacing:4px}
.sub{margin:8px 0 24px;color:#aaa;font-size:14px}
.links{display:grid;gap:13px}
a{
  display:block;
  padding:16px 18px;
  border-radius:13px;
  color:#fff;
  text-decoration:none;
  font-weight:700;
  letter-spacing:.5px;
  background:linear-gradient(135deg,#171717,#101010);
  border:1px solid #292929;
  transition:.2s;
}
a:hover{
  transform:translateY(-2px) scale(1.01);
  border-color:#ff7a00;
  box-shadow:0 0 20px rgba(255,100,0,.22);
}
.icon{margin-right:8px}
small{display:block;margin-top:22px;color:#666;font-size:11px}
@keyframes pulse{to{transform:scale(1.08);opacity:.8}}
@keyframes fire{to{transform:translateX(-50%) scale(1.12);opacity:.7}}
</style>
</head>
<body>
<div class="flame"></div>

<main class="card">
  <img class="logo" src="logo.png" alt="PROTOTYPE">
  <h1>PROTOT🔥YPE🔥</h1>
  <p class="sub">Ognie • Animacje • Wydarzenia</p>

  <div class="links">
 
    <a href="https://www.instagram.com/prototype_group/" target="_blank"><span class="icon">📸</span> Instagram</a>
    <a href="https://www.facebook.com/PrototypeGroupFire" target="_blank"><span class="icon">📘</span> Facebook</a>
    <a href="https://tiktok.com/" target="_blank"><span class="icon">🎵</span> TikTok</a>
    <a href="https://buycoffee.to/" target="_blank"><span class="icon">☕</span> Podobał Ci się pokaz? Postaw nam kawę ☕</a>
  </div>

  <small>PROTOTYPE</small>
</main>
</body>
</html>
